# Replaces the image's local-config.yaml, which ships no retention at all: logs there
# are kept forever. These logs carry client networks and player IDs (see
# docs/data-inventory.md), so the period has to be stated and enforced.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # The default "info" logs a line per push, into the very store it is pushed to.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 14 days, enforced by the compactor below - retention_period alone only affects
  # queries.
  retention_period: 336h
  # One misbehaving container must not fill the disk or this service's memory:
  # 2 MB/s is still ~170 GB/day, so DiskFilling fires long before the cap does, and
  # one stream (a crash-looping container) gets a quarter of it.
  ingestion_rate_mb: 2
  ingestion_burst_size_mb: 4
  per_stream_rate_limit: 512KB
  per_stream_rate_limit_burst: 1MB
  max_streams_per_user: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # The application's logs arrive over OTLP. Only these two resource attributes
  # become index labels - both are fixed per deployment. Everything else a record
  # carries (trace_id, span_id, player_id, client_net, ...) is structured metadata:
  # queryable, never an index label, so no per-player value can multiply streams.
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes: [service.name, deployment.environment.name]
        - action: drop
          regex: telemetry\.sdk\..*

compactor:
  working_directory: /loki/compactor
  # Without these two the retention above is advisory: chunks stay on disk forever.
  retention_enabled: true
  delete_request_store: filesystem

# Nothing here writes alerting rules; without a local store the ruler looks for a
# remote one and logs about it every cycle.
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
