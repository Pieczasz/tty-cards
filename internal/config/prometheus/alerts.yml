# Delivered by Alertmanager (internal/config/alertmanager) to Telegram ("Alert delivery" in
# docs/SECURITY.md); Prometheus shows them either way.
#
# The backend pushes over OTLP every 60s (the SDK's periodic reader), so one sample a
# minute per series. The increase() alerts can fire on the first event after a boot
# because observability.Setup exports a zero for each series they watch
# (seedAlertedSeries): a counter otherwise has no series until its first event, and
# increase() needs two samples. The zero reaches Prometheus with the first export, so
# an event in the process's first minute is still that first sample and is missed.
#
# Unit tests: alerts_test.yml, with the image compose pins:
#   docker run --rm --entrypoint promtool -v "$PWD/internal/config/prometheus:/rules:ro" \
#     -w /rules prom/prometheus:v3.1.0 test rules alerts_test.yml
groups:
  - name: tty-cards
    rules:
      - alert: MatchResultLost
        expr: increase(ttycards_match_finalize_total{outcome=~"dropped|error"}[5m]) > 0
        labels:
          severity: page
        annotations:
          summary: "match results are being lost ({{ $value }} in 5m)"

      # Latency: a pushed series has no staleness marker, so it stays present for the
      # 5m lookback after its last sample, and then `for` adds 2m. The alert fires 7-8
      # minutes after the backend's last export.
      - alert: BackendMetricsAbsent
        expr: absent(ttycards_ssh_sessions_active)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "backend stopped reporting metrics"

      - alert: SSHSessionPanics
        expr: increase(ttycards_ssh_session_panics_total[5m]) > 0
        labels:
          severity: warn
        annotations:
          summary: "panics recovered in SSH sessions"

      # Saturation is the pool held near its cap, not a burst of waits: at 90% for 5m
      # the next spike queues every query behind it.
      - alert: DBPoolSaturation
        expr: ttycards_db_pool_connections_used >= 0.9 * ttycards_db_pool_connections_max
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "the database pool has been at 90% of its connections for 5m"

      - alert: BroadcasterDroppingEvents
        expr: increase(ttycards_broadcaster_events_dropped_total[10m]) > 0
        labels:
          severity: warn
        annotations:
          summary: "slow subscribers are losing game events"

      - alert: GoroutineGrowth
        expr: >-
          go_goroutine_count > 500
          and
          go_goroutine_count > 12 * scalar(max(ttycards_ssh_sessions_active))
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "goroutine count is abnormally high"
