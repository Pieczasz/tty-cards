server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

compactor:
  compaction:
    # 48 hours, deliberately the shortest retention in the stack: a session span
    # carries the username (see docs/data-inventory.md), and traces are a debugging
    # aid for the last day or two.
    block_retention: 48h

ingester:
  # Cut blocks on a schedule, not only on size, so the retention above is measured
  # from roughly when the trace happened and recent traces do not sit in memory.
  max_block_duration: 10m

# One runaway trace, or one flood of them, must not spend the 384MiB this service
# has: the default ingestion limit is 15 MB/s.
overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 2000000
      burst_size_bytes: 4000000
      max_traces_per_user: 5000
    global:
      max_bytes_per_trace: 5000000

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false
