apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # trace_id is structured metadata on every OTLP record (Loki's OTLP endpoint
      # puts it there), which a "label" matcher reads.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -1h
        spanEndTimeShift: 1h
        # The trace ID is structured metadata, not text in the line, so the default
        # generated line filter (|= "<id>") would never match.
        customQuery: true
        query: '{service_name="tty-cards-server"} | trace_id="$${__trace.traceId}"'
