apiVersion: 1

providers:
  - name: tty cards
    orgId: 1
    folder: tty cards
    type: file
    disableDeletion: false
    # The JSON files are the source of truth: a UI save would be silently replaced
    # by the file on the next restart, so Grafana refuses it and offers the JSON.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
