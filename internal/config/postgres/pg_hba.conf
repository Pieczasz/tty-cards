# Compose's Postgres accepts TCP only over TLS. hostnossl rejects a plaintext
# connection before any password is exchanged, so a client with sslmode=disable is
# refused by the server as well as by the backend's own config check. The socket is
# reachable only from inside the container (pg_isready, docker compose exec psql).
#
# TYPE     DATABASE  USER  ADDRESS  METHOD
local      all       all            trust
hostssl    all       all   all      scram-sha-256
hostnossl  all       all   all      reject
