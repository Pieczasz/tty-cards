# One worker per core: nginx defaults to a single worker, which with 1024
# connections and two per proxied SSH session capped the server at ~500 players
# while the backend advertises MAX_CONNECTIONS=1000.
worker_processes auto;

# stderr, which Docker captures and Alloy ships to Loki, at `error` and above. An
# error line names the client ("client: 203.0.113.7"), so Alloy rewrites that field
# on this container's lines (stage.replace in config.alloy) and keeps the rest,
# which is what keeps an upstream failure diagnosable. The limit_* rejections below
# are logged at warn, under this threshold: the limiter already does its job, and a
# line per rejection would put every throttled client's address into Loki for 14
# days. Set once here; stream{} and http{} inherit it.
error_log stderr error;

events {
    # Each proxied SSH session holds two connections (client side + backend side),
    # so this must be at least 2x the backend's MAX_CONNECTIONS per worker.
    worker_connections 4096;
}

stream {
    # Collapse IPv6 to its /64, the way ratelimit.NetKey does: one customer is
    # routinely delegated 2^64 addresses, so keying on $binary_remote_addr (a /128)
    # lets a single subscriber walk past limit_conn with a fresh address per
    # connection. IPv4 falls through to the address itself.
    #
    # The regex only matches an address whose first four hextets are all written out,
    # which is what a delegated /64 presents. A "::"-compressed address cannot be
    # prefixed by regex alone and falls back to the full address - no worse than
    # before, and the backend's own limiter is the authority on /64 either way.
    map $remote_addr $client_net {
        default                                                      $remote_addr;
        "~^(?<v6net>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):" $v6net;
    }

    # Limit concurrent SSH connections per real client network at the edge. This is
    # the one limit the backend cannot apply itself: it caps pre-auth TCP, which
    # never reaches the auth limiter.
    limit_conn_zone $client_net zone=ssh_addr:10m;
    limit_conn_log_level warn;

    # Docker's embedded DNS. Without `resolve` below, nginx looks `backend` up once at
    # start and keeps that address forever, so recreating the backend container
    # strands the proxy on a dead IP until someone restarts it too. Upstream `resolve`
    # is in open-source nginx from 1.27.3, hence the 1.28 image.
    resolver 127.0.0.11 valid=10s;

    upstream ssh_backend {
        zone ssh_backend 64k;
        server backend:6969 resolve;
    }

    # Explicit, because the stream module's default is already off and a silent
    # default is not a decision: proxied SSH connections are not logged here. The
    # backend records the session itself, and duplicating the client address into a
    # second store only widens what has to be retained and erased.
    access_log off;

    server {
        # Both families: the `edge` network in compose.yaml has IPv6, so an IPv6
        # client arrives with its own address instead of NATed behind the bridge
        # gateway, where every IPv6 player would share one limit_conn bucket.
        listen 22 so_keepalive=on;
        listen [::]:22 so_keepalive=on;
        limit_conn ssh_addr 8;
        proxy_pass ssh_backend;
        # Forward the real client IP so the backend's per-IP rate limiter,
        # logs, and traces see the client, not this proxy.
        proxy_protocol on;
        # An idle game session is legitimately quiet for a long time; reaching the
        # backend is not. A 1h connect timeout let a dead backend hold every
        # connecting client, and its limit_conn slot, for an hour.
        proxy_timeout 1h;
        proxy_connect_timeout 5s;
    }
}

http {
    # This file replaces nginx's default conf wholesale, so the mime map it normally
    # provides has to be included by hand. Without it every static file is served as
    # application/octet-stream and browsers refuse to apply the stylesheet.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;

    # Public read-only stats feed for the website. Nothing here is authenticated and
    # nothing accepts writes, so the only thing worth defending is the cost of a
    # flood - hence the per-IP request zone below, on top of the backend's own limit.
    # Same /64 collapse as the stream block: see the comment on its map. The two
    # contexts cannot share one map, so this is a deliberate duplicate.
    map $remote_addr $client_net {
        default                                                      $remote_addr;
        "~^(?<v6net>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):" $v6net;
    }

    limit_req_zone $client_net zone=api_addr:10m rate=2r/s;
    # Concurrent connections too: limit_req counts requests, so without this one
    # client can hold open as many idle or slow-header connections as it likes.
    limit_conn_zone $client_net zone=http_addr:10m;
    limit_req_log_level warn;
    limit_conn_log_level warn;
    # 429, not the default 503: the site's client, and any monitor, should read
    # "slow down", not "the server is down".
    limit_req_status 429;
    limit_conn_status 429;
    # A client that sends its headers or body a byte at a time holds a connection
    # for the 60s default; nothing legitimate here takes more than a moment.
    client_header_timeout 10s;
    client_body_timeout 10s;

    # See the stream block's resolver.
    resolver 127.0.0.11 valid=10s;

    upstream stats_api {
        zone stats_api 64k;
        server backend:6970 resolve;
    }

    server_tokens off;

    # nginx's compiled-in default is `combined`, which opens with $remote_addr and
    # also records the full User-Agent - and Alloy ships this container's stdout
    # straight into Loki. That made the proxy a second, undeclared source of personal
    # data for a feed that is public, anonymous and read-only.
    #
    # Everything an operator actually reads a proxy log for is still here: when, what,
    # how it went, how long it took, how big it was. The client's identity is not,
    # because nothing here needs it - the rate limiter keys on $client_net inside
    # nginx and never touches the log.
    log_format privacy '$time_iso8601 $status $request_method $uri '
                       '$body_bytes_sent $request_time $upstream_status';
    access_log /dev/stdout privacy;

    # The apex keeps ssh (port 22, above) and the JSON API. The website itself lives
    # on www, served by GitHub Pages behind Cloudflare - the apex cannot be proxied by
    # Cloudflare because a proxied hostname resolves to Cloudflare's IPs and `ssh
    # tty.cards` would follow it there.
    #
    # TLS is still not terminated here. It has to be before launch: the site fetches
    # https://tty.cards/api, and a page served over https cannot call a plaintext
    # origin. Until then LiveStats shows "server unreachable", which is honest.
    # Uncomment the 443 server below once certificates are mounted.
    server {
        listen 80;
        listen [::]:80;
        server_name tty.cards;
        limit_conn http_addr 16;

        # /api/healthz pings the database on every request and exists for the backend
        # container's own healthcheck, which reaches it on loopback inside the compose
        # network. The proxy passes /api/ through wholesale, so it has to be shut out
        # by name or any caller can spend a database round-trip per request.
        location = /api/healthz {
            return 404;
        }

        # This proxy's own liveness probe, deliberately separate from the one above:
        # a static string, no upstream, no database, nothing to spend. Public, because
        # `location /` below would otherwise redirect it and the healthcheck runs
        # against 127.0.0.1 with no Host of its own.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            limit_req zone=api_addr burst=10 nodelay;

            # The trailing slash on proxy_pass strips /api, so the backend keeps
            # serving its own /v1/... paths.
            proxy_pass http://stats_api/;

            # API_TRUST_PROXY reads the leftmost entry of this header for its rate
            # limit, so it has to be set here and must not be forwarded from the
            # client. $remote_addr, not $proxy_add_x_forwarded_for: appending would
            # let a caller inject a leading address and take over the bucket.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_http_version 1.1;

            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # Everything that is not the API belongs to the website, which is on www.
        # 301 rather than serving a second copy from /srv/site: two origins for the
        # same pages means they drift, and search engines see duplicates.
        location / {
            return 301 https://www.tty.cards$request_uri;
        }
    }

    # Uncomment once certificates for tty.cards are mounted into this container.
    # Two ways to get them, both free:
    #
    #   certbot  - a certbot service in compose sharing a volume with this one, or
    #              certbot on the host with /etc/letsencrypt bind-mounted in.
    #   Cloudflare Origin CA - a 15-year certificate from the Cloudflare dashboard.
    #              Only trusted by Cloudflare, so it works for a proxied hostname but
    #              NOT for the grey-clouded apex, which browsers reach directly.
    #
    # The apex is grey-clouded, so it needs a publicly trusted certificate: certbot.
    #
    # server {
    #     listen 443 ssl;
    #     listen [::]:443 ssl;
    #     http2 on;
    #     server_name tty.cards;
    #     limit_conn http_addr 16;
    #
    #     ssl_certificate     /etc/letsencrypt/live/tty.cards/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/tty.cards/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #
    #     location = /api/healthz {
    #         return 404;
    #     }
    #
    #     location /api/ {
    #         limit_req zone=api_addr burst=10 nodelay;
    #         proxy_pass http://stats_api/;
    #         proxy_set_header X-Forwarded-For $remote_addr;
    #         proxy_set_header Host $host;
    #         proxy_http_version 1.1;
    #         proxy_connect_timeout 3s;
    #         proxy_read_timeout 5s;
    #     }
    #
    #     location / {
    #         return 301 https://www.tty.cards$request_uri;
    #     }
    # }
}
