# Sizing target: this whole stack fits in 8 GiB and 4 cores of a 12 GiB / 6-core VPS,
# leaving the rest to the host. Every service therefore carries an explicit mem_limit,
# and they add up on purpose:
#
#   backend 4096 + db 1536 + prometheus 512 + loki 512 + tempo 384
#   + alloy 256 + grafana 320 + proxy 128 + certbot 128 + docker-socket-proxy 32
#   + alertmanager 32                                     = 7936 MiB (~7.75 GiB)
#
# migrate, db-certs and proxy-certs are not in that sum: they run to completion before
# the backend starts, so they never hold memory at the same time as anything they are
# listed beside. Nor is rclone, which runs only for the minute a backup upload takes.
#
# CPU works the other way round. `cpus` is a ceiling, not a reservation, and only two
# services here can sustain load: backend (3.0) and db (1.0) = 4.0 of 6 cores. The
# observability sidecars are capped tight (2.0 total, ~0.2 in practice) purely so that
# none of them can ever compete with a game in progress.
#
# Every image is pinned by digest as well as tag: a tag is republished whenever its
# base is rebuilt, so the tag alone does not say what runs. Dependabot
# (.github/dependabot.yml) proposes both together, and CI fails on an unpinned image.
#
# Go reads the cgroup CPU limit for GOMAXPROCS, so lowering the backend's `cpus` also
# lowers its parallelism - see the GOGC note on that service before changing it.
x-defaults: &defaults
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  # No service here needs to gain privileges after start: this stops a setuid binary
  # in any image from being a way up. CI asserts every service carries it.
  security_opt:
    - no-new-privileges:true

services:
  # The backend refuses a plaintext database outside ENV=development, so the bundled
  # Postgres serves TLS with a self-signed certificate made here on first start.
  # sslmode=require encrypts without verifying the certificate, which is what a
  # private network with no CA can offer. Remove the db-tls volume to rotate it.
  db-certs:
    image: alpine/openssl:3.5.8@sha256:3f25da71f70eba788067daac3f3df03bd1de7a7c52ed89fa93b94ad2c92d986b
    <<: *defaults
    mem_limit: 32m
    cpus: 0.5
    volumes:
      - db-tls:/tls
    entrypoint: ["sh", "-euc"]
    command:
      - |
        [ -s /tls/server.key ] && exit 0
        openssl req -x509 -nodes -days 3650 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
          -subj /CN=db -addext subjectAltName=DNS:db \
          -keyout /tls/server.key.tmp -out /tls/server.crt
        chown 70:70 /tls/server.key.tmp /tls/server.crt
        chmod 600 /tls/server.key.tmp
        mv /tls/server.key.tmp /tls/server.key

  migrate:
    image: migrate/migrate:v4.18.3@sha256:39b59b389634e43bb3f2d4e94bc1edef0775ec2a9a3540ce6a2cf330e5daae55
    <<: *defaults
    mem_limit: 128m
    cpus: 0.5
    volumes:
      - ./internal/db/migrations:/migrations:ro
    # The password stays out of the URL, where it would be argv - visible in `ps` on
    # the host and in `docker inspect`'s Args. migrate's postgres driver is lib/pq,
    # which reads PGPASSWORD when the URL carries none. CI asserts the URL has none.
    environment:
      - PGPASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
    command:
      [
        "-path=/migrations",
        "-database=postgres://${DB_USER:-postgres}@db:5432/${DB_NAME:-terminal_card}?sslmode=require",
        "up",
      ]
    depends_on:
      db:
        condition: service_healthy
    restart: "on-failure"

  # Wish SSH backend. Do NOT add a host port: mapping for 6969 - PROXY protocol
  # trusts the client address in the header; only the nginx proxy service may reach
  # it, and PROXY_TRUSTED_CIDRS below refuses a header from anywhere else.
  backend:
    restart: unless-stopped
    <<: *defaults
    build:
      context: .
      dockerfile: cmd/server/Dockerfile
    environment:
      - ENV=production
      # Stamped onto service.version so dashboards can tell deploys apart; without
      # it every release reports the same constant.
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=6969
      # Only the edge network may send a PROXY header, and only nginx and this
      # service sit on it - see `networks:` at the bottom. Keep in step with its
      # subnets.
      - PROXY_TRUSTED_CIDRS=172.29.69.0/24,fd6b:1e37:9a52:6969::/64
      # Stats feed for the website. Reached only through the proxy's /api/ location -
      # deliberately never published to the host, which is also what makes it safe
      # for the backend to trust X-Forwarded-For for its rate limit.
      - API_PORT=6970
      - API_TRUST_PROXY=true
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_NAME=${DB_NAME:-terminal_card}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - DB_SSLMODE=require
      # Must stay at or under the db service's max_connections (50) minus migrate's
      # one, or a saturated pool becomes "FATAL: sorry, too many clients already".
      - DB_MAX_OPEN_CONNS=25
      - SSH_KEY_PATH=/data/ssh/server
      # A URL: the OTel SDK parses this variable too, and http:// is what says plaintext.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - RATE_LIMIT_CONNECTIONS=5
      - RATE_LIMIT_WINDOW=1s
      # The most sessions measured to hold on this service's 3 cores (cmd/loadtest,
      # a third playing, the rest browsing at 120x40): 1250 kept the p95
      # move round-trip at 131ms with none lost; 1500 saturated the cores and lost
      # moves and sessions. Past this a player gets "server full" instead of every
      # table slowing down. Re-measure before raising it, with cpus and GOMEMLIMIT.
      - MAX_CONNECTIONS=1250
      # Rendering a frame costs ~4k allocations against a live heap of a few tens of
      # MB, so the default GOGC=100 collects constantly and GC, not the cores, becomes
      # the ceiling: measured on 6 cores, GOGC=400 renders 62% more frames a second
      # than the default, while on 2 cores it is worth ~4%. Raise this with the core
      # count, not the RAM - and note `cpus: 3.0` below is what the core count now is,
      # because Go derives GOMAXPROCS from the cgroup quota.
      - GOGC=400
      # The backstop that makes the line above safe: collection is forced as the heap
      # approaches this, so a traffic spike cannot turn a relaxed GOGC into an OOM.
      # With GOGC=400 the heap grows until it meets this limit, so the container sits
      # above it by whatever the runtime holds but has not returned: measured at
      # 1000 sessions, 1.87GiB resident against a 1.5GiB limit (+25%, mostly
      # transparent huge pages). Hence 62.5% of mem_limit, not 75%: 2.5GiB x 1.25 =
      # 3.1GiB, leaving ~900MiB before the kernel kills. GODEBUG=disablethp=1 closed
      # that gap but cost 45% more CPU and a 120ms p95 move round-trip; not worth it.
      # A session costs ~1.3MiB of heap at the 120x40 floor tier (internal/ssh
      # termsize.go), so 1250 of them need ~1.6GiB live (2.8GiB resident at 1250
      # measured), plus up to ~330MiB for terminals granted more than the floor
      # (extraCellBudget, decision #61): raise this with MAX_CONNECTIONS, never alone.
      - GOMEMLIMIT=2560MiB
    # The hard ceiling the kernel enforces; GOMEMLIMIT above is sized against it.
    mem_limit: 4g
    cpus: 3.0
    volumes:
      - ssh-keys:/data/ssh
    # A card server needs no privileges and writes nothing outside its volume.
    # The named mount above stays writable: read_only covers the image layer only,
    # which is what keygen needs for /data/ssh.
    read_only: true
    cap_drop: [ALL]
    networks: [default, edge]
    healthcheck:
      # The image is FROM scratch - there is no shell and no wget - so the server
      # binary probes its own stats API (-healthcheck -> GET /healthz, which pings the
      # database). Plain compose only *marks* a container unhealthy; pair with an
      # auto-restarter (or Docker Swarm) if unattended recovery matters.
      test: ["CMD", "/usr/local/bin/backend", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Longer than run's worst-case sequential drain (30s SSH Shutdown + 5s session
    # teardown + 5s stats API + 15s finalizers + a second 15s finalizer window + 6s
    # OTel flush = 76s),
    # with headroom for the db close and final log writes, so a redeploy cannot
    # SIGKILL the process while a ranked match is still being persisted or
    # telemetry flushed. cmd/server's shutdown timeout constants depend on this number.
    stop_grace_period: 80s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: always
    <<: *defaults
    mem_limit: 1536m
    # Measured under 1000 players: under 1% of a core and ~70MiB. A cap, not a
    # reservation; with the backend's 3.0 it keeps sustained load within 4 cores.
    cpus: 1.0
    depends_on:
      db-certs:
        condition: service_completed_successfully
    # Postgres sizes nothing from the cgroup, so every number below is derived from
    # the 1536m above by hand:
    #   shared_buffers        25% of the limit
    #   effective_cache_size  what the planner may assume is cached, ~2/3
    #   work_mem              per sort node, not per connection: 50 x a few sorts at
    #                         4MB still fits beside shared_buffers
    #   maintenance_work_mem  one-off, for the migrate service's index builds
    #   max_connections       backend pool (25) + migrate (1) + room for a psql,
    #                         because each idle backend still costs several MB
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=96MB
      - -c
      - max_connections=50
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    # PG 18+ versions PGDATA under /var/lib/postgresql/<major>/docker; the volume
    # is the parent so a later major upgrade can pg_upgrade in place.
    volumes:
      - db-data:/var/lib/postgresql
      - db-tls:/etc/postgresql/tls:ro
      - ./internal/config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    environment:
      - POSTGRES_DB=${DB_NAME:-terminal_card}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # nginx will not start without the certificate its 443 server names, and Let's
  # Encrypt cannot issue one until nginx is up to answer the challenge. This breaks
  # the cycle: a self-signed placeholder on first start, which certbot (below)
  # overwrites with the real certificate once issued. Browsers reject the
  # placeholder, which is the honest answer until then.
  proxy-certs:
    image: alpine/openssl:3.5.8@sha256:3f25da71f70eba788067daac3f3df03bd1de7a7c52ed89fa93b94ad2c92d986b
    <<: *defaults
    mem_limit: 32m
    cpus: 0.5
    volumes:
      - proxy-tls:/tls
    environment:
      - TTY_DOMAIN=${TTY_DOMAIN:-tty.cards}
    entrypoint: ["sh", "-euc"]
    command:
      - |
        [ -s /tls/fullchain.pem ] && exit 0
        umask 077
        openssl req -x509 -nodes -days 3650 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
          -subj "/CN=$$TTY_DOMAIN" -addext "subjectAltName=DNS:$$TTY_DOMAIN" \
          -keyout /tls/privkey.pem -out /tls/fullchain.pem.tmp
        mv /tls/fullchain.pem.tmp /tls/fullchain.pem

  proxy:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    <<: *defaults
    mem_limit: 128m
    cpus: 0.5
    volumes:
      - type: bind
        source: ./internal/config/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - proxy-tls:/etc/nginx/tls:ro
      - acme-webroot:/var/www/certbot:ro
    # nginx reads its certificate at start and on reload only, and certbot replaces
    # it in a volume, so this checks the file once a minute and reloads when it
    # changed (after `nginx -t`, so a bad pair keeps the old one serving). Skipping
    # the image's entrypoint costs nothing: its scripts only edit the default
    # conf.d, which nginx.conf does not include.
    entrypoint: ["sh", "-euc"]
    command:
      - |
        cert=/etc/nginx/tls/fullchain.pem
        (
          last=$$(cksum < "$$cert")
          while sleep 60; do
            now=$$(cksum < "$$cert") || continue
            if [ "$$now" != "$$last" ] && nginx -t -q; then
              nginx -s reload && last=$$now
            fi
          done
        ) &
        exec nginx -g 'daemon off;'
    # The only ports this deployment publishes. Everything else talks over the compose
    # network: publishing 6969 would let clients forge PROXY headers and defeat the
    # per-network rate limiter, and publishing 6970 would let them forge
    # X-Forwarded-For, which API_TRUST_PROXY=true above tells the backend to believe.
    ports:
      - 22:22
      - 80:80
      - 443:443
    # Only the edge network: nginx needs the backend and nothing else, and the
    # backend trusts PROXY headers from this network alone.
    networks: [edge]
    # The master process starts as root to bind 22/80 and then drops to the nginx
    # user; these four are exactly what that takes (bind, chown its temp dirs,
    # setuid/setgid to the worker user). Everything else root would carry is gone.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Probed every 2s until the first pass, so certbot, which waits for this,
      # does not sit out a whole 30s interval on every start.
      start_period: 30s
      start_interval: 2s
    depends_on:
      backend:
        condition: service_started
      proxy-certs:
        condition: service_completed_successfully

  # Obtains and renews the apex certificate (internal/config/certbot/renew.sh) over
  # the webroot nginx serves at /.well-known/acme-challenge/. TTY_DOMAIN must resolve
  # to this host, grey-clouded, with port 80 open; until then it retries hourly and
  # nginx keeps the placeholder. ACME_EMAIL is optional.
  certbot:
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    restart: unless-stopped
    <<: *defaults
    mem_limit: 128m
    cpus: 0.2
    # renew.sh is PID 1 otherwise, and a shell there ignores the SIGTERM `docker
    # compose stop` sends, so every stop would wait out the 10s kill timeout.
    init: true
    environment:
      - TTY_DOMAIN=${TTY_DOMAIN:-tty.cards}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./internal/config/certbot/renew.sh:/renew.sh:ro
      # The account key and every issued certificate: keep it, or a redeploy
      # re-issues and spends Let's Encrypt's five-per-week duplicate limit.
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/certbot
      - proxy-tls:/tls
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/letsencrypt
      - /var/lib/letsencrypt
    cap_drop: [ALL]
    entrypoint: ["/renew.sh"]
    depends_on:
      proxy:
        condition: service_healthy

  # Only the off-host copy in scripts/backup.sh runs this, with the backup directory
  # and the rclone config mounted per run; the profile keeps it out of `up`. A
  # service rather than a `docker run` in the script so the digest pin is checked
  # by CI and moved by Dependabot like every other image.
  rclone:
    image: rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
    profiles: [backup]
    <<: *defaults
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp

  # Observability stack (Alloy -> Loki/Tempo/Prometheus + Grafana). None of these
  # publish a port: Grafana is the only one an operator ever opens, and it is reached
  # on loopback (below) through an SSH tunnel to the host.
  alloy:
    image: grafana/alloy:v1.8.3@sha256:ab04df3936e4d71d31b6f55e0c58a7e749091f59635dd8c2bc731ba1b6c93701
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.4
    <<: *defaults
    # Dropping NET_RAW and the rest keeps a compromised sidecar from spoofing db on
    # the default network. Alloy runs as root over a data directory the image gives
    # to its alloy user (473, mode 770), so root needs DAC_OVERRIDE to reach it, and
    # nothing more: Docker is reached over TCP through the socket proxy. The other
    # sidecars below run as their own non-root users and need no capability.
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    volumes:
      - ./internal/config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Log read positions and the metrics WAL. In the container layer they went with
      # every recreate, which then replayed each container's whole log: old lines
      # rejected as too old, recent ones stored twice.
      - alloy-data:/var/lib/alloy/data
    # docker-api reaches the socket proxy below; default reaches Loki and the rest.
    networks: [default, docker-api]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    # ~80% of mem_limit; config.alloy's memory_limiter refuses data below it.
    environment:
      - GOMEMLIMIT=204MiB
    # The backend reaches these over the compose network as alloy:4317.
    expose:
      - 4317
      - 4318
    # No healthcheck: the alloy image carries no shell HTTP client (no wget, no curl,
    # no nc), and a healthcheck whose command does not exist marks the container
    # unhealthy forever, which is worse than none. Prometheus scrapes its /metrics
    # instead, so a stopped Alloy fires PipelineTargetDown (alerts-pipeline.yml).
    depends_on:
      - loki
      - tempo
      - prometheus
      - docker-socket-proxy

  # What Alloy reads container logs through, instead of mounting the Docker socket:
  # `:ro` on a socket restricts nothing - any client of it can start a privileged
  # container, which is root on the host. This passes exactly the GETs Alloy makes
  # (list, inspect, logs, networks, version) and refuses every other path and method:
  # a section-level proxy (CONTAINERS=1) also serves /containers/{id}/archive and
  # /export, i.e. any container's files - PGDATA, the SSH host key. Its network is
  # internal and it answers Alloy alone, because container inspect includes every
  # container's environment, DB_PASSWORD among it.
  docker-socket-proxy:
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.1
    <<: *defaults
    # Root rather than the image's 65534, because the docker group's id differs per
    # host. With no capabilities, root here opens the socket it owns and nothing else.
    user: "0:0"
    cap_drop: [ALL]
    read_only: true
    command:
      - -listenip=0.0.0.0
      - -allowfrom=alloy
      - -loglevel=warn
      - -allowGET=(/v[0-9.]+)?/(_ping|version|networks|containers/json|containers/[a-zA-Z0-9_.-]+/(json|logs))
      - -allowHEAD=(/v[0-9.]+)?/_ping
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    expose:
      - 2375

  loki:
    image: grafana/loki:3.4.2@sha256:58a6c186ce78ba04d58bfe2a927eff296ba733a430df09645d56cdc158f3ba08
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.3
    <<: *defaults
    cap_drop: [ALL]
    command: -config.file=/etc/loki/loki.yaml
    # Go does not read the cgroup limit, so without this the GC lets the heap grow
    # until the kernel kills it. ~80% of mem_limit; the same holds for tempo.
    environment:
      - GOMEMLIMIT=410MiB
    volumes:
      # Replaces the image's local-config.yaml, which keeps logs forever and stores
      # them in the container's writable layer. 14-day retention lives in this file.
      - ./internal/config/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    expose:
      - 3100
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  tempo:
    image: grafana/tempo:2.7.1@sha256:4443be217c396b065ee34845534199c36fdba4dc619cb96550e228d73fba6e69
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.2
    <<: *defaults
    cap_drop: [ALL]
    command: -config.file=/etc/tempo/tempo.yaml
    environment:
      - GOMEMLIMIT=307MiB
    volumes:
      - ./internal/config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    expose:
      - 3200
      - 4317
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3200/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.3
    <<: *defaults
    cap_drop: [ALL]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      # 30 days. Metrics are the one store here with no personal data in it - every
      # attribute is a bounded enum, enforced by internal/observability's tests - so
      # this is a disk decision, not a privacy one, and a month of history is what
      # makes "is this deploy slower than last month's" answerable.
      - --storage.tsdb.retention.time=30d
      # Belt and braces: whichever bound is hit first wins, so a cardinality mistake
      # costs a gap in history rather than the host's disk.
      - --storage.tsdb.retention.size=8GB
    volumes:
      - ./internal/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./internal/config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./internal/config/prometheus/alerts-pipeline.yml:/etc/prometheus/alerts-pipeline.yml:ro
      - prometheus-data:/prometheus
    expose:
      - 9090
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Routes what Prometheus fires to Telegram (internal/config/alertmanager/alertmanager.yml;
  # setup in docs/SECURITY.md, "Alert delivery").
  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.1
    <<: *defaults
    cap_drop: [ALL]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # One instance: no gossip listener, and no log line every cycle about peers.
      - --cluster.listen-address=
    volumes:
      - ./internal/config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Silences and the notification log, so a restart does not re-send everything.
      - alertmanager-data:/alertmanager
      # Telegram's bot token and chat id, from a directory outside the checkout so
      # neither can be committed. Docker creates it empty when it is missing:
      # Alertmanager then runs and only its sends fail.
      - ${ALERTMANAGER_SECRETS_DIR:-/etc/tty-cards/alertmanager}:/etc/alertmanager/secrets:ro
    expose:
      - 9093
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.6.16@sha256:d67af92050b8d93b393dc741864752a69c9da1ffa39c1bb9af49ad5d9e47d2c3
    restart: unless-stopped
    # Measured at 253 of 256m idle (page cache included), so any dashboard load
    # risked the kernel's OOM kill.
    mem_limit: 320m
    cpus: 0.2
    <<: *defaults
    cap_drop: [ALL]
    volumes:
      - ./internal/config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./internal/config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./internal/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Anonymous Admin, no login form, no password: the gate is the VPS. This port is
      # published on loopback only (below, and asserted in CI), so reaching Grafana at
      # all means an SSH session on the host - and anyone with that already owns the
      # database, the volumes and every secret in this file. A password here would
      # protect nothing and add one more credential to rotate and forget. Never widen
      # the binding without adding real authentication first.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Its info level was the noisiest stream in Loki (~1500 lines/h idle).
      - GF_LOG_LEVEL=warn
      # DNS rebinding: a web page the operator visits can point its own hostname at
      # 127.0.0.1 and, through the ssh tunnel, reach this anonymous Admin from the
      # browser. Refusing any Host but localhost closes that; open it as
      # http://localhost:3000.
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ENFORCE_DOMAIN=true
    # Loopback only, and the one exception to "nothing but the proxy publishes a
    # port": reach it with `ssh -L 3000:127.0.0.1:3000 <host>`. It is never bound to
    # 0.0.0.0 - the anonymous Admin above assumes exactly this, and CI asserts it.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # The Host header, because ENFORCE_DOMAIN above redirects any other; 127.0.0.1
      # rather than localhost, which may resolve to a ::1 this network does not have.
      test: ["CMD", "wget", "-q", "-O", "-", "--header", "Host: localhost", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - loki
      - tempo
      - prometheus

networks:
  default:
  # nginx and the backend only. IPv6 is on so that an IPv6 client reaches nginx with
  # its own address: without it Docker's userland proxy accepts the connection and
  # re-originates it from the bridge gateway, and every IPv6 player shares one
  # rate-limit bucket. The subnets are fixed because PROXY_TRUSTED_CIDRS on the
  # backend names them; change both together. They are private (RFC 1918 / ULA)
  # ranges, so pick others only if they collide with the host's.
  edge:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.29.69.0/24
        - subnet: fd6b:1e37:9a52:6969::/64
  # Alloy <-> docker-socket-proxy. internal: no route out, and nothing else on it.
  docker-api:
    internal: true

volumes:
  db-data:
  db-tls:
  ssh-keys:
  proxy-tls:
  letsencrypt:
  acme-webroot:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
  alloy-data:
  alertmanager-data:
