# Sizing target: this whole stack fits in 6 GiB of a 12 GiB / 6-core VPS, leaving the
# other half to the host. Every service therefore carries an explicit mem_limit, and
# they add up on purpose:
#
#   backend 2048 + db 1536 + prometheus 512 + loki 512 + tempo 384
#   + alloy 256 + grafana 256 + proxy 128 + docker-socket-proxy 32
#                                                         = 5664 MiB (~5.5 GiB)
#
# migrate is not in that sum: it runs to completion before the backend starts, so it
# never holds memory at the same time as anything it is listed beside.
#
# CPU works the other way round. `cpus` is a ceiling, not a reservation, and only two
# services here can sustain load: backend (3.0) and db (1.5) = 4.5 of 6 cores. The
# observability sidecars are capped tight (2.0 total, ~0.2 in practice) purely so that
# none of them can ever compete with a game in progress.
#
# Every image is pinned by digest as well as tag: a tag is republished whenever its
# base is rebuilt, so the tag alone does not say what runs. Dependabot
# (.github/dependabot.yml) proposes both together, and CI fails on an unpinned image.
#
# Go reads the cgroup CPU limit for GOMAXPROCS, so lowering the backend's `cpus` also
# lowers its parallelism - see the GOGC note on that service before changing it.
x-defaults: &defaults
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  # No service here needs to gain privileges after start: this stops a setuid binary
  # in any image from being a way up. CI asserts every service carries it.
  security_opt:
    - no-new-privileges:true

services:
  migrate:
    image: migrate/migrate:v4.18.3@sha256:39b59b389634e43bb3f2d4e94bc1edef0775ec2a9a3540ce6a2cf330e5daae55
    <<: *defaults
    mem_limit: 128m
    cpus: 0.5
    volumes:
      - ./internal/db/migrations:/migrations:ro
    # ACKNOWLEDGED DEBT: the password is in this argv, so it shows up in `ps` on the
    # host and in `docker inspect`. migrate's image is FROM scratch - no shell - so it
    # cannot read a Docker secret and assemble the DSN itself, and moving the value to
    # an env_file changes nothing: compose interpolates it into argv either way.
    # The two real fixes, neither done here because neither can be verified without
    # bringing the stack up: (a) drop the password from the URL and pass PGPASSWORD,
    # if the pinned migrate build's postgres driver honours it, or (b) run migrations
    # from `make migrate-up` on the host and delete this service.
    command:
      [
        "-path=/migrations",
        "-database=postgres://${DB_USER:-postgres}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/${DB_NAME:-terminal_card}?sslmode=disable",
        "up",
      ]
    depends_on:
      db:
        condition: service_healthy
    restart: "on-failure"

  # Wish SSH backend. Do NOT add a host port: mapping for 6969 - PROXY protocol
  # trusts the client address in the header; only the nginx proxy service may reach
  # it, and PROXY_TRUSTED_CIDRS below refuses a header from anywhere else.
  backend:
    restart: unless-stopped
    <<: *defaults
    build:
      context: .
      dockerfile: cmd/server/Dockerfile
    environment:
      - ENV=production
      # Stamped onto service.version so dashboards can tell deploys apart; without
      # it every release reports the same constant.
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=6969
      # Only the edge network may send a PROXY header, and only nginx and this
      # service sit on it - see `networks:` at the bottom. Keep in step with its
      # subnets.
      - PROXY_TRUSTED_CIDRS=172.29.69.0/24,fd6b:1e37:9a52:6969::/64
      # Stats feed for the website. Reached only through the proxy's /api/ location -
      # deliberately never published to the host, which is also what makes it safe
      # for the backend to trust X-Forwarded-For for its rate limit.
      - API_PORT=6970
      - API_TRUST_PROXY=true
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_NAME=${DB_NAME:-terminal_card}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - DB_SSLMODE=disable
      - ALLOW_INSECURE_DB=true
      # Must stay at or under the db service's max_connections (50) minus migrate's
      # one, or a saturated pool becomes "FATAL: sorry, too many clients already".
      - DB_MAX_OPEN_CONNS=25
      - SSH_KEY_PATH=/data/ssh/server
      - OTEL_EXPORTER_OTLP_ENDPOINT=alloy:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - RATE_LIMIT_CONNECTIONS=5
      - RATE_LIMIT_WINDOW=1s
      - MAX_CONNECTIONS=1000
      # Rendering a frame costs ~4k allocations against a live heap of a few tens of
      # MB, so the default GOGC=100 collects constantly and GC, not the cores, becomes
      # the ceiling: measured on 6 cores, GOGC=400 renders 62% more frames a second
      # than the default, while on 2 cores it is worth ~4%. Raise this with the core
      # count, not the RAM - and note `cpus: 3.0` below is what the core count now is,
      # because Go derives GOMAXPROCS from the cgroup quota.
      - GOGC=400
      # The backstop that makes the line above safe: collection is forced as the heap
      # approaches this, so a traffic spike cannot turn a relaxed GOGC into an OOM.
      # Keep it at roughly 75% of whatever mem_limit this service is given.
      # Measured (cmd/loadtest, menu journey): ~1MB per parked session. 1GiB sat
      # exactly at the limit with 1000 sessions; 1536MiB gives the advertised
      # MAX_CONNECTIONS=1000 real headroom. Raise both together before raising
      # MAX_CONNECTIONS.
      - GOMEMLIMIT=1536MiB
    # The hard ceiling GOMEMLIMIT is 75% of; the kernel kills past this, Go GC
    # holds well under it.
    mem_limit: 2g
    cpus: 3.0
    volumes:
      - ssh-keys:/data/ssh
    # A card server needs no privileges and writes nothing outside its volume.
    # The named mount above stays writable: read_only covers the image layer only,
    # which is what keygen needs for /data/ssh.
    read_only: true
    cap_drop: [ALL]
    networks: [default, edge]
    healthcheck:
      # The image is FROM scratch - there is no shell and no wget - so the server
      # binary probes its own stats API (-healthcheck -> GET /healthz, which pings the
      # database). Plain compose only *marks* a container unhealthy; pair with an
      # auto-restarter (or Docker Swarm) if unattended recovery matters.
      test: ["CMD", "/usr/local/bin/backend", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Longer than run's worst-case sequential drain (30s SSH Shutdown + 5s stats
    # API + 15s finalizers + a second 15s finalizer window + 5s OTel flush = 70s),
    # with headroom for the db close and final log writes, so a redeploy cannot
    # SIGKILL the process while a ranked match is still being persisted or
    # telemetry flushed. cmd/server's waitForFinalizers comment depends on this number.
    stop_grace_period: 80s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: always
    <<: *defaults
    mem_limit: 1536m
    cpus: 1.5
    # Postgres sizes nothing from the cgroup, so every number below is derived from
    # the 1536m above by hand:
    #   shared_buffers        25% of the limit
    #   effective_cache_size  what the planner may assume is cached, ~2/3
    #   work_mem              per sort node, not per connection: 50 x a few sorts at
    #                         4MB still fits beside shared_buffers
    #   maintenance_work_mem  one-off, for the migrate service's index builds
    #   max_connections       backend pool (25) + migrate (1) + room for a psql,
    #                         because each idle backend still costs several MB
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=96MB
      - -c
      - max_connections=50
    # PG 18+ versions PGDATA under /var/lib/postgresql/<major>/docker; the volume
    # is the parent so a later major upgrade can pg_upgrade in place.
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${DB_NAME:-terminal_card}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    <<: *defaults
    mem_limit: 128m
    cpus: 0.5
    volumes:
      - type: bind
        source: ./internal/config/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    # The only ports this deployment publishes. Everything else talks over the compose
    # network: publishing 6969 would let clients forge PROXY headers and defeat the
    # per-network rate limiter, and publishing 6970 would let them forge
    # X-Forwarded-For, which API_TRUST_PROXY=true above tells the backend to believe.
    ports:
      - 22:22
      - 80:80
    # Only the edge network: nginx needs the backend and nothing else, and the
    # backend trusts PROXY headers from this network alone.
    networks: [edge]
    # The master process starts as root to bind 22/80 and then drops to the nginx
    # user; these four are exactly what that takes (bind, chown its temp dirs,
    # setuid/setgid to the worker user). Everything else root would carry is gone.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - backend

  # Observability stack (Alloy -> Loki/Tempo/Prometheus + Grafana). None of these
  # publish a port: Grafana is the only one an operator ever opens, and it is reached
  # on loopback (below) through an SSH tunnel to the host.
  alloy:
    image: grafana/alloy:v1.8.3@sha256:ab04df3936e4d71d31b6f55e0c58a7e749091f59635dd8c2bc731ba1b6c93701
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.4
    <<: *defaults
    volumes:
      - ./internal/config/alloy/config.alloy:/etc/alloy/config.alloy:ro
    # docker-api reaches the socket proxy below; default reaches Loki and the rest.
    networks: [default, docker-api]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    # The backend reaches these over the compose network as alloy:4317.
    expose:
      - 4317
      - 4318
    # No healthcheck: the alloy image carries no shell HTTP client (no wget, no curl,
    # no nc), and a healthcheck whose command does not exist marks the container
    # unhealthy forever, which is worse than none. Its /-/ready is scraped instead.
    depends_on:
      - loki
      - tempo
      - prometheus
      - docker-socket-proxy

  # What Alloy reads container logs through, instead of mounting the Docker socket:
  # `:ro` on a socket restricts nothing - any client of it can start a privileged
  # container, which is root on the host. This answers GET only (POST defaults to 0)
  # and only the sections enabled here: containers (list, inspect, logs) and
  # networks, which discovery.docker lists. Its network is internal and shared with
  # Alloy alone, because container inspect includes every container's environment,
  # DB_PASSWORD among it.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.1
    <<: *defaults
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      # haproxy logs every request at info, and Alloy polls every few seconds.
      - LOG_LEVEL=warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    expose:
      - 2375

  loki:
    image: grafana/loki:3.4.2@sha256:58a6c186ce78ba04d58bfe2a927eff296ba733a430df09645d56cdc158f3ba08
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.3
    <<: *defaults
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      # Replaces the image's local-config.yaml, which keeps logs forever and stores
      # them in the container's writable layer. 14-day retention lives in this file.
      - ./internal/config/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    expose:
      - 3100
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  tempo:
    image: grafana/tempo:2.7.1@sha256:4443be217c396b065ee34845534199c36fdba4dc619cb96550e228d73fba6e69
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.2
    <<: *defaults
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./internal/config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    expose:
      - 3200
      - 4317
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3200/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.3
    <<: *defaults
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      # 30 days. Metrics are the one store here with no personal data in it - every
      # attribute is a bounded enum, enforced by internal/observability's tests - so
      # this is a disk decision, not a privacy one, and a month of history is what
      # makes "is this deploy slower than last month's" answerable.
      - --storage.tsdb.retention.time=30d
      # Belt and braces: whichever bound is hit first wins, so a cardinality mistake
      # costs a gap in history rather than the host's disk.
      - --storage.tsdb.retention.size=8GB
    volumes:
      - ./internal/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./internal/config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    expose:
      - 9090
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  grafana:
    image: grafana/grafana:11.6.16@sha256:d67af92050b8d93b393dc741864752a69c9da1ffa39c1bb9af49ad5d9e47d2c3
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.2
    <<: *defaults
    volumes:
      - ./internal/config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./internal/config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./internal/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Anonymous Admin, no login form, no password: the gate is the VPS. This port is
      # published on loopback only (below, and asserted in CI), so reaching Grafana at
      # all means an SSH session on the host - and anyone with that already owns the
      # database, the volumes and every secret in this file. A password here would
      # protect nothing and add one more credential to rotate and forget. Never widen
      # the binding without adding real authentication first.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # DNS rebinding: a web page the operator visits can point its own hostname at
      # 127.0.0.1 and, through the ssh tunnel, reach this anonymous Admin from the
      # browser. Refusing any Host but localhost closes that; open it as
      # http://localhost:3000.
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ENFORCE_DOMAIN=true
    # Loopback only, and the one exception to "nothing but the proxy publishes a
    # port": reach it with `ssh -L 3000:127.0.0.1:3000 <host>`. It is never bound to
    # 0.0.0.0 - the anonymous Admin above assumes exactly this, and CI asserts it.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # The Host header, because ENFORCE_DOMAIN above redirects any other; 127.0.0.1
      # rather than localhost, which may resolve to a ::1 this network does not have.
      test: ["CMD", "wget", "-q", "-O", "-", "--header", "Host: localhost", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - loki
      - tempo
      - prometheus

networks:
  default:
  # nginx and the backend only. IPv6 is on so that an IPv6 client reaches nginx with
  # its own address: without it Docker's userland proxy accepts the connection and
  # re-originates it from the bridge gateway, and every IPv6 player shares one
  # rate-limit bucket. The subnets are fixed because PROXY_TRUSTED_CIDRS on the
  # backend names them; change both together. They are private (RFC 1918 / ULA)
  # ranges, so pick others only if they collide with the host's.
  edge:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.29.69.0/24
        - subnet: fd6b:1e37:9a52:6969::/64
  # Alloy <-> docker-socket-proxy. internal: no route out, and nothing else on it.
  docker-api:
    internal: true

volumes:
  db-data:
  ssh-keys:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
