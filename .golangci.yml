version: "2"

run:
  tests: true
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unparam
    - modernize
    - revive
    - godot
    - misspell
    - gomoddirectives
    - goprintffuncname
    - noctx
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - wrapcheck
    - cyclop
    - funlen
    - gocognit
    - nestif
    - lll
    - prealloc
    - testifylint
    - thelper
    - paralleltest
    - tparallel
    - usetesting
    # Security and correctness.
    - gosec
    - errorlint
    - errchkjson
    - forcetypeassert
    - spancheck
    - bodyclose
    - exhaustive
    - nilnil
    - durationcheck
    - makezero
    - reassign
    - predeclared
    - asasalint
    - bidichk
    - gocheckcompilerdirectives
    - gocritic
    # Logging: slog is the only logger, so every call site should be well-formed.
    - sloglint
    # Architecture: the layer rules from CLAUDE.md, enforced rather than remembered.
    - depguard
    - iface
    - recvcheck
    - errname
    - fatcontext
    # Style that stays fixed once fixed.
    - copyloopvar
    - intrange
    - perfsprint
    - unconvert
    - wastedassign
    - nakedret
    - nolintlint
    - godox
    - dupl
    - exptostd
    - mirror
    - usestdlibvars
    - testableexamples

  exclusions:
    generated: lax
    rules:
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      # Table-driven tests are legitimately long and repetitive, and a test's
      # branchiness is not a maintenance signal the way production code's is.
      - path: _test\.go
        linters:
          - cyclop
          - funlen
          - gocognit
          - nestif
          - lll
          - prealloc
          - wrapcheck
          - errcheck
          - noctx
          # A test asserting a message type is the point of the test; a mock returning
          # nil, nil is the shape testify's mock.Called forces; table-driven tests
          # repeat by design.
          - forcetypeassert
          - nilnil
          - dupl
          - gosec

  settings:
    usetesting:
      context-background: true
      context-todo: true
    depguard:
      rules:
        repository-only-from-root:
          list-mode: lax
          files: ["!**/cmd/server/**", "!**/internal/repository/**", "!$test"]
          deny:
            - pkg: github.com/Pieczasz/terminal-card/internal/repository
              desc: only cmd/server (the composition root) may import the GORM implementations; depend on the internal/db interfaces
        # An allow-list, so a new dependency is a decision rather than a default: the
        # rules and engine know nothing of the database, the TUI or lobbies. gametest
        # is test support and may use the test libraries.
        game-is-pure:
          list-mode: strict
          files: ["**/internal/game/**", "!**/internal/game/gametest/**", "!$test"]
          allow:
            - $gostd
            - github.com/Pieczasz/terminal-card/internal/deck
            - github.com/Pieczasz/terminal-card/internal/broadcaster
            - github.com/Pieczasz/terminal-card/internal/game
            - uuid
    dupl:
      threshold: 120
    gocritic:
      enabled-tags: [diagnostic, performance]
      # A type switch with one case is the idiomatic Bubble Tea Update shape.
      disabled-checks: [hugeParam, rangeValCopy, singleCaseSwitch]
    exhaustive:
      # A switch with a default has said what it does with the rest.
      default-signifies-exhaustive: true
    spancheck:
      checks: [end, record-error, set-status]
      # recordSpanResult records the error and sets the status; span.End stays at the
      # call site where spancheck can see it.
      ignore-check-signatures: ["recordSpanResult"]
    gosec:
      # G104 is errcheck's job and is configured there. G704 (SSRF taint) has exactly
      # one client call to look at, the container healthcheck against loopback, and
      # flags its source and sink in turn no matter where a waiver sits.
      excludes: [G104, G704]
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    cyclop:
      # lobby view handleKey is 21: a flat key dispatch, branchy but not complex.
      max-complexity: 21
    funlen:
      lines: 75
      statements: 55
    gocognit:
      min-complexity: 30
    nestif:
      min-complexity: 9
    lll:
      line-length: 140

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
