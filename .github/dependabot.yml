version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # cmd/server/Dockerfile: the golang builder and alpine certs stages.
  - package-ecosystem: docker
    directory: /cmd/server
    schedule:
      interval: weekly

  # compose.yaml: every service image.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
