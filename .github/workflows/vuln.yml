name: Vuln
# test.yml runs govulncheck only when something is pushed. An advisory published
# against an unchanged go.sum during a quiet week needs this weekly run on main to
# be seen. Only the scan, not the whole test pipeline.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.3'

    - name: govulncheck
      run: make vulncheck
