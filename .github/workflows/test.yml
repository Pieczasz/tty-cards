name: Test

# The site has its own workflow (web.yml); a site-only or docs-only change runs
# nothing here. Markdown is safe to skip because nothing in the Go build embeds it
# (the one go:embed is the SQL migrations).
on:
  push:
    branches: [ "main", "master" ]
    paths-ignore: [ "web/**", "**.md" ]
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore: [ "web/**", "**.md" ]

# Nothing here writes to the repository; a compromised step gets a read-only token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.27.1'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: go test ./... -race -short -shuffle=on -count=1

  integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.27.1'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run integration tests
      run: go test ./... -race -shuffle=on -tags=integration -count=1 -timeout 15m

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.27.1'
        cache: false

    - name: golangci-lint
      # Prebuilt binaries lag the module's Go version (v2.12.x is go1.26 and
      # refuses go 1.27.x). goinstall builds with the setup-go toolchain.
      uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
      with:
        version: v2.13.2
        install-mode: goinstall

    - name: gofmt and go fix leave nothing to change
      run: |
        test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        test -z "$(go fix -diff ./...)" || { go fix -diff ./...; exit 1; }

    # The action above lints the default build; the integration tests are a second
    # build that the size gates and test linters must also pass.
    - name: golangci-lint (integration tag)
      run: golangci-lint run --build-tags=integration ./...

    - name: deadcode
      run: |
        out=$(go run golang.org/x/tools/cmd/deadcode@v0.50.0 -test ./...)
        if [ -n "$out" ]; then echo "$out"; exit 1; fi

  vulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.27.1'

    # Reachability-based, so it fails only on advisories our call graph can actually
    # reach. Clean today; this is what keeps it clean.
    #
    # Pinned, not @latest: @latest makes every run depend on whatever was published
    # that morning, so a release that changes the exit codes or drops a Go version
    # turns a green pipeline red on a commit that touched nothing. Bump deliberately.
    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # The Dockerfile is not exercised by any test, and it was wrong for months without
  # anything noticing: it built one file instead of the package, and cross-built for
  # the wrong architecture. Building it here is the only thing that catches that.
  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Build the server image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        file: cmd/server/Dockerfile
        # linux/arm64 as well as the runner's own arch, because the deployment target
        # may be either and TARGETOS/TARGETARCH handling is exactly what broke before.
        platforms: linux/amd64,linux/arm64
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

  compose:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    # Interpolation happens at parse time, so `docker compose config` is a real check
    # on every ${VAR} in the file - including the ones that must have no default.
    - name: Validate compose and the proxy config
      env:
        DB_PASSWORD: ci
      run: |
        docker compose config --quiet
        # The image compose runs, digest and all, so this tests what is deployed.
        nginx_image=$(docker compose config --format json | jq -r '.services.proxy.image')
        docker run --rm -v "$PWD/internal/config/nginx.conf:/etc/nginx/nginx.conf:ro" \
          "$nginx_image" nginx -t
        alloy_image=$(docker compose config --format json | jq -r '.services.alloy.image')
        docker run --rm -v "$PWD/internal/config/alloy/config.alloy:/c/config.alloy:ro" \
          "$alloy_image" fmt /c/config.alloy > /dev/null

    # Grafana is anonymous-admin on purpose, so the VPS itself is the gate: it must
    # never be published on anything but loopback. This is the one line that keeps
    # that true when someone edits the ports.
    - name: Grafana stays on loopback
      env:
        DB_PASSWORD: ci
      run: |
        bindings=$(docker compose config --format json | jq -r '.services.grafana.ports[]? | "\(.host_ip // "0.0.0.0"):\(.published)"')
        echo "grafana publishes: $bindings"
        [ "$bindings" = "127.0.0.1:3000" ] || { echo "grafana must publish only 127.0.0.1:3000" >&2; exit 1; }

    # A missing DB_PASSWORD used to interpolate to an empty string, and the stack came
    # up with a passwordless database. It has to be a parse error instead.
    - name: Compose refuses to start without DB_PASSWORD
      run: |
        if env -u DB_PASSWORD docker compose config --quiet 2>/dev/null; then
          echo "docker compose config must fail when DB_PASSWORD is unset" >&2; exit 1
        fi

    # The hardening below is all configuration, so no Go test can fail when someone
    # edits it away. These assertions are that test.
    - name: Deployment hardening holds
      env:
        DB_PASSWORD: ci
      run: |
        cfg=$(docker compose config --format json)
        fail() { echo "$1" >&2; exit 1; }

        # D1: every image pinned by digest (backend is built, so it has none).
        unpinned=$(jq -r '.services | to_entries[] | select(.value.image != null and (.value.image | test("@sha256:[0-9a-f]{64}$") | not)) | .key' <<<"$cfg")
        [ -z "$unpinned" ] || fail "images not pinned by digest: $unpinned"

        # D10: no service may gain privileges; the proxy keeps only what nginx needs.
        missing=$(jq -r '.services | to_entries[] | select((.value.security_opt // []) | index("no-new-privileges:true") | not) | .key' <<<"$cfg")
        [ -z "$missing" ] || fail "services without no-new-privileges: $missing"
        jq -e '.services.proxy.cap_drop == ["ALL"]' <<<"$cfg" >/dev/null || fail "proxy must cap_drop ALL"
        jq -e '.services.proxy.cap_add | sort == ["CHOWN","NET_BIND_SERVICE","SETGID","SETUID"]' <<<"$cfg" >/dev/null \
          || fail "proxy cap_add must be exactly NET_BIND_SERVICE, CHOWN, SETUID, SETGID"

        # D2: IPv6 on the proxy's network, nginx listening on both families, and the
        # backend trusting PROXY headers from that network only.
        jq -e '.networks.edge.enable_ipv6 == true' <<<"$cfg" >/dev/null || fail "edge network must enable IPv6"
        jq -e '.services.proxy.networks | keys == ["edge"]' <<<"$cfg" >/dev/null || fail "proxy must sit on edge only"
        subnets=$(jq -r '[.networks.edge.ipam.config[].subnet] | join(",")' <<<"$cfg")
        trusted=$(jq -r '.services.backend.environment.PROXY_TRUSTED_CIDRS' <<<"$cfg")
        [ "$trusted" = "$subnets" ] || fail "PROXY_TRUSTED_CIDRS ($trusted) must equal the edge subnets ($subnets)"
        grep -q 'listen \[::\]:22 ' internal/config/nginx.conf || fail "nginx must listen on [::]:22"
        grep -q 'listen \[::\]:80;' internal/config/nginx.conf || fail "nginx must listen on [::]:80"

        # D3: Grafana answers only to Host: localhost (DNS rebinding).
        jq -e '.services.grafana.environment.GF_SERVER_ENFORCE_DOMAIN == "true"' <<<"$cfg" >/dev/null \
          || fail "grafana must set GF_SERVER_ENFORCE_DOMAIN=true"

        # D9: Alloy reads Docker through the socket proxy, never the socket.
        jq -e '[.services.alloy.volumes[]? | .source] | any(test("docker.sock")) | not' <<<"$cfg" >/dev/null \
          || fail "alloy must not mount the Docker socket"

        # P2: no client address reaches Loki from nginx's error log.
        for d in 'error_log stderr error;' 'limit_req_log_level warn;' 'limit_conn_log_level warn;' \
                 'limit_req_status 429;' 'proxy_connect_timeout 5s;'; do
          grep -qF "$d" internal/config/nginx.conf || fail "nginx.conf lost: $d"
        done
        grep -q 'stage.replace' internal/config/alloy/config.alloy || fail "alloy must redact nginx client addresses"

        # P3: local backups never enter the image build context.
        grep -qx 'backups/' .dockerignore || fail ".dockerignore must exclude backups/"

        echo "deployment hardening holds"
