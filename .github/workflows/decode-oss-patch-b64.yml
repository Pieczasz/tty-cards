name: decode-oss-patch-b64
on:
  workflow_dispatch:
  push:
    paths: ['docs/tarsier-oss-patch/b64/**', '.github/workflows/decode-oss-patch-b64.yml']
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode available parts and verify
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, glob, os
          expect = {
            1: ("fc85b6f35bfce84ea8b4841bce2a02e9300d40a294eb40891ec44a90c84a5b3a", 18927),
            2: ("605eae3b8cb71ebf96a42cff6fdca445d947e2cf0bcf55d4d49855144c859dc1", 18927),
            3: ("1abf537f11b3f79e63aaf492621088fdc11bb0d242f83da3920eca0a9423d2b5", 18925),
          }
          os.makedirs("docs/tarsier-oss-patch", exist_ok=True)
          written = []
          for i, (h, n) in expect.items():
            parts = sorted(glob.glob(f"docs/tarsier-oss-patch/b64/part{i}.*.b64"))
            if not parts:
              print("skip", i, "no chunks")
              continue
            b64 = "".join(open(p).read().strip() for p in parts)
            try:
              text = base64.b64decode(b64).decode("utf-8")
            except Exception as e:
              print("skip", i, "decode", e)
              continue
            got = hashlib.sha256(text.encode()).hexdigest()
            if len(text) != n or got != h:
              print("skip", i, "incomplete/mismatch", len(text), got)
              continue
            open(f"docs/tarsier-oss-patch/TAR-73-100.part{i}.patch.txt", "w").write(text)
            written.append(i)
            print("OK", i, n, got)
          if not written:
            raise SystemExit("no complete parts to write")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tarsier-oss-patch/TAR-73-100.part*.patch.txt
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "docs: decode exact TAR-73/100 OSS patch parts from b64 chunks"
          git push
